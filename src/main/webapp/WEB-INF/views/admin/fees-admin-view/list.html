<!DOCTYPE HTML>
<html layout:decorate="~{../layouts/admin.html}"
      th:lang="${#locale}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sd="http://www.thymeleaf.org/spring-data"
      xmlns:th="http://www.thymeleaf.org">
<div layout:fragment="content">
    <div class="col-md-12">
        <a class="absButton" data-role="button" th:href="@{${listAllTxEvts != null && listAllTxEvts ? '/admin/csv' : '/admin/evts/' + payEvt.id + '/fees/csv'}}">
            <img alt="CSV" th:src="@{'/resources/images/csv_text.png'}"/>
        </a>
        <div class="row" id="pl_org_esupportail_pay_domain_PayTransactionLog">
                <th:block th:if="${listAllTxEvts == null || !listAllTxEvts}">
                    <h3>
                        [[${payEvt.title.labelLocales['fr'].translation}]]
                    </h3>
                </th:block>
                <th:block th:if="${total != null}">
                    <i>
                        [[${page.getContent().size()}]] transactions pour un total de [[${total}]]
                    </i>
                </th:block>
                <div th:with="feesListUrl=${listAllTxEvts != null && listAllTxEvts ? '/admin/fees' : '/admin/evts/' + payEvt.id + '/fees'}">
                <div class="form-inline" style="margin: 12px 0 8px;">
                  <label class="control-label" style="margin-right: 8px; font-weight: 600;" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_status}">Filtre</label>
                  <div class="btn-group btn-group-sm" role="group" aria-label="status-filter">
                      <a class="btn status-filter-btn" th:classappend="${successfulOnly ? ' btn-success active' : ' btn-default'}" th:href="@{${feesListUrl}(successfulOnly=true)}" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_status_success}">
                          Succès
                      </a>
                      <a class="btn status-filter-btn" th:classappend="${!successfulOnly ? ' btn-danger active' : ' btn-default'}" th:href="@{${feesListUrl}(successfulOnly=false)}" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_status_error}">
                          Erreur
                      </a>
                  </div>
                </div>
                <form method="get" th:action="@{${feesListUrl}}" class="form-inline" style="margin: 0 0 16px;" id="searchFilterForm">
                   <input type="hidden" name="successfulOnly" th:value="${successfulOnly}"/>
                   <div class="form-group" style="margin-right: 8px;">
                       <label class="control-label sr-only" th:for="filter_field1" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_field1}">Champ1</label>
                       <input id="filter_field1" type="text" name="field1" class="form-control input-sm"
                              th:placeholder="#{label_org_esupportail_pay_domain_paytransactionlog_field1}"
                              th:value="${field1}"/>
                   </div>
                   <div class="form-group" style="margin-right: 8px;">
                       <label class="control-label sr-only" th:for="filter_field2" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_field2}">Champ2</label>
                       <input id="filter_field2" type="text" name="field2" class="form-control input-sm"
                              th:placeholder="#{label_org_esupportail_pay_domain_paytransactionlog_field2}"
                              th:value="${field2}"/>
                   </div>
                   <div class="form-group" style="margin-right: 8px;">
                       <label class="control-label sr-only" th:for="filter_mail" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_mail}">Email</label>
                       <input id="filter_mail" type="text" name="mail" class="form-control input-sm"
                              th:placeholder="#{label_org_esupportail_pay_domain_paytransactionlog_mail}"
                              th:value="${mail}"/>
                   </div>
                   <div class="form-group" style="margin-right: 8px;">
                       <label class="control-label sr-only" th:for="filter_hasAbo" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_hasAbo}">Abonnement</label>
                       <select id="filter_hasAbo" name="hasAbo" class="form-control input-sm">
                           <option value="" th:selected="${hasAbo == null}" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_hasAbo_all}">Tous</option>
                           <option value="true" th:selected="${hasAbo != null && hasAbo}" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_hasAbo_with}">Avec abonnement</option>
                           <option value="false" th:selected="${hasAbo != null && !hasAbo}" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_hasAbo_without}">Sans abonnement</option>
                       </select>
                   </div>
                   <button type="submit" class="btn btn-primary btn-sm" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_search}">Rechercher</button>
                   <a class="btn btn-default btn-sm" style="margin-left: 4px;" th:href="@{${feesListUrl}(successfulOnly=${successfulOnly})}" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_filter_reset}">Réinitialiser</a>
                </form>
                <div th:id="${listAllTxEvts != null && listAllTxEvts ? listFees : listFees2}">
                    <table class="table table-bordered" th:with="typeName=#{menu_item_paytransactionlog_new_label}">
                        <thead>
                        <tr>
                            <th>Evt</th>
                            <th >EvtMnt</th>
                            <th>
                                <a class="sorting" sd:pagination-sort="transactionDate" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_transactiondate}">
                                </a>
                            </th>
                            <th>
                                <a class="sorting" sd:pagination-sort="mail" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_mail}">
                                </a>
                            </th>
                            <th>
                                <a class="sorting" sd:pagination-sort="montant">Montant (€)</a>
                            </th>
                            <th>
                                <a class="sorting" sd:pagination-sort="field1" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_field1}">
                                </a>
                            </th>
                            <th>
                                <a class="sorting" sd:pagination-sort="field2" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_field2}">
                                </a>
                            </th>
                            <th th:text="#{label_org_esupportail_pay_domain_paytransactionlog_mailsent}">
                            </th>
                            <th th:if="${page_hasAbo && idAbo == null}" th:text="#{label_org_esupportail_pay_domain_paytransactionlog_idAbo_filter}">
                                Voir
                            </th>
                            <th class="btnCrudTable" th:text="#{entity_show(${typeName})}">
                                Voir
                            </th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="row : ${page}" th:classappend="${row.erreur != '00000' ? 'danger' : 'success'}">
                            <td th:text="${row.payEvtMontant.evt.title.labelLocales['fr'].translation}">
                            </td>
                            <td th:text="${row.payEvtMontant.title.labelLocales['fr'].translation}">
                            </td>
                                          <td th:text="${#temporals.format(row.transactionDate, 'MEDIUM', #locale)}">
                            </td>
                            <td th:text="${row.mail}">
                            </td>
                            <td th:text="${row.montantDevise}">
                            </td>
                            <td th:text="${row.field1}">
                            </td>
                            <td th:text="${row.field2}">
                            </td>
                            <td th:text="${row.mailSent}">
                            </td>
                            <td class="utilbox" th:if="${page_hasAbo && idAbo == null}">
                                <a th:if="${row.idAbo != null && row.idAbo != '0'}" th:class="btn" th:classappend="${row.erreur != '00000' ? 'btn-danger' : 'btn-success'}" th:alt="#{menu_item_paytransactionlog_idAbo_filter}" th:href="@{fees(idAbo=${row.idAbo})}" th:title="#{label_org_esupportail_pay_domain_paytransactionlog_idAbo_filter}">
                                    <img class="image" th:alt="#{label_org_esupportail_pay_domain_paytransactionlog_idAbo_filter}" th:src="@{/resources/images/calendar.svg}" th:title="#{label_org_esupportail_pay_domain_paytransactionlog_idAbo_filter}"/>
                                </a>
                            </td>
                            <td class="utilbox">
                                <a th:class="btn" th:classappend="${row.erreur != '00000' ? 'btn-danger' : 'btn-success'}" th:alt="#{menu_item_paytransactionlog_new_label}" th:href="@{'/admin/fees/' + ${row.id}}" th:title="#{menu_item_paytransactionlog_new_label}">
                                    <img class="image" th:alt="#{menu_item_paytransactionlog_new_label}" th:src="@{/resources/images/repository.svg}" th:title="#{menu_item_paytransactionlog_new_label}"/>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="col-md-4 col-md-offset-5"  th:if="${listAllTxEvts}">
                        <nav class="center-block btn-toolbar" th:fragment="pagination">
                            <div class="btn-group">
                                <div class="btn-group dropup" sd:page-size-selector="dropdown" style="margin-top: 20px">
                                </div>
                                <ul class="btn-group pagination" sd:pagination="full">
                                </ul>
                            </div>
                        </nav>
                    </div>
                </div>
                </div>
        </div>
    </div>
    <script>
        var csvImgUrl= "[[@{'/resources/images/csv_text.png'}]]";
        var csvUrl= "[[@{'/admin/csv'}]]";
    </script>
    <script th:if="${payEvt != null && payEvt.id != null}">
        var csvUrl= "[[@{'/admin/evts/' + ${payEvt.id} + '/fees/csv'}]]";
    </script>
    <script>
        (function() {
            var filterParams = ['field1', 'field2', 'mail', 'hasAbo', 'successfulOnly'];
            var urlParams = new URLSearchParams(window.location.search);

            function applyFiltersToLink(link) {
                var href = link.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('javascript')) return;
                try {
                    var url = new URL(href, window.location.origin);
                    filterParams.forEach(function(param) {
                        if (urlParams.has(param) && !url.searchParams.has(param)) {
                            url.searchParams.set(param, urlParams.get(param));
                        }
                    });
                    link.setAttribute('href', url.pathname + url.search);
                } catch(e) {}
            }

            document.addEventListener('DOMContentLoaded', function() {
                // Preserve filters in pagination and page-size links
                document.querySelectorAll('ul.pagination a, .btn-group.dropup a').forEach(applyFiltersToLink);

                // Preserve search filters in status filter buttons (keep current field1/field2/mail/hasAbo)
                document.querySelectorAll('a.status-filter-btn').forEach(function(link) {
                    var href = link.getAttribute('href');
                    if (!href) return;
                    try {
                        var url = new URL(href, window.location.origin);
                        ['field1', 'field2', 'mail', 'hasAbo'].forEach(function(param) {
                            if (urlParams.has(param) && urlParams.get(param) !== '') {
                                url.searchParams.set(param, urlParams.get(param));
                            }
                        });
                        link.setAttribute('href', url.pathname + url.search);
                    } catch(e) {}
                });
            });
        })();
    </script>
</div>
</html>
